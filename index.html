<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#0f1226,#161b3f);color:#e8ecff;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:40px 18px}
.logo{width:84px;height:84px;border-radius:22px;background:linear-gradient(135deg,#22c55e,#60a5fa);
  display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:18px;box-shadow:0 8px 30px rgba(34,197,94,.4)}
h1{font-size:26px;margin-bottom:6px}
.sub{color:#9aa3d0;font-size:14px;margin-bottom:36px}
.card{width:100%;max-width:380px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:18px;padding:20px;margin-bottom:14px;display:flex;align-items:center;gap:16px;text-decoration:none;
  color:#e8ecff;transition:.15s}
.card:active{transform:scale(.98)}
.card .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.card.g .ic{background:rgba(34,197,94,.2)}
.card.o .ic{background:rgba(249,115,22,.2)}
.card .t{font-size:17px;font-weight:700}
.card .d{font-size:12px;color:#9aa3d0;margin-top:2px}
.foot{margin-top:30px;color:#6b739c;font-size:12px;text-align:center;line-height:1.8;max-width:360px}
.foot a{color:#60a5fa}
</style>
</head>
<body>
<div class="logo">💪</div>
<h1>我的工作台</h1>
<div class="sub">减肥记录 · 跨境备货物流管理</div>

  <div><div class="t">减肥工作台</div><div class="d">体重趋势 · BMI · 饮食运动打卡</div></div>
</a>
<a class="card o" href="stock.html">
